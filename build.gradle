plugins {
    // 26.1 起 Minecraft 不再混淆：非混淆版本要用 net.fabricmc.fabric-loom 这个插件 ID
    // （混淆版本即 1.21.11 及更早用的是 net.fabricmc.fabric-loom-remap / 遗留的 fabric-loom）。
    // 非 remap 的 Loom 没有 remapJar / remapSourcesJar 任务，见下面的 packageRelease。
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "easyelevator" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    // 仅开发环境：光影栈（Iris）走 Modrinth 的 maven。版本留空即不添加，构建产物与打包任务都不受影响。
    if (project.hasProperty('iris_version') && project.iris_version) {
        maven { url = 'https://api.modrinth.com/maven'; name = 'Modrinth' }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.3 是未混淆版本：不需要任何 mappings 依赖（源码直接用官方命名书写）。
    // 也不再需要 modImplementation：非 remap 的 Loom 不做重映射，模组依赖就是普通依赖。
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 光影栈（仅开发环境，见 gradle.properties）：让 `runClient` 能开光影复现观感。
    // 用 modRuntimeOnly：模组源码不引用它们的 API，只需要它们在运行时在场。
    // 注意 artifactId 是 Modrinth 的项目 ID（Iris = YL57xq9U、Sodium = AANobbMI），不是 slug；
    // Iris 硬依赖 Sodium 0.6.x，缺了它连游戏都起不来。
    if (project.hasProperty('iris_version') && project.iris_version) {
        runtimeOnly "maven.modrinth:YL57xq9U:${project.iris_version}"
        runtimeOnly "maven.modrinth:AANobbMI:${project.sodium_version}"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    // 生成 sourcesJar（packageRelease 会把它放进 sources/）。
    // 本线用的是非 remap 的 Loom：没有 RemapSourcesJar 这一步，sourcesJar 直接产出。
    withSourcesJar()
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('wrapper') {
    gradleVersion = '9.6.0'
    distributionType = Wrapper.DistributionType.BIN
    networkTimeout = 120000
    distributionSha256Sum = 'bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01'
}

// Allowlisted portable project: no local paths, caches, credentials, test worlds or downloaded tools.
tasks.register('packageProject', Zip) {
    group = 'distribution'
    description = 'Package the editable project, wrapper, documentation and scripts.'
    archiveFileName = "${project.archives_base_name}-${project.version}-project.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into('EasyElevator') {
        from(projectDir) {
            include 'src/**', 'docs/**'
            include 'gradle/wrapper/**', 'gradlew', 'gradlew.bat'
            include 'build.gradle', 'settings.gradle', 'gradle.properties', '.gitignore', 'README.md', 'LICENSE.txt'
        }
    }
}

// 工程内没有测试源码：关掉 java 插件自动创建的 test / testClasses 任务，避免它们出现在 `gradlew tasks`
// 或日常构建输出里误导使用者。验收改为进游戏按 docs/TESTING.md 的人工清单逐项确认。
tasks.named('test') {
    enabled = false
}
tasks.named('testClasses') {
    enabled = false
}

tasks.register('packageRelease', Zip) {
    group = 'distribution'
    description = 'Build and package installable jars and documentation.'
    dependsOn 'build'
    archiveFileName = "${project.archives_base_name}-${project.version}-release.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    // 非 remap 的 Loom（未混淆版本）没有 remapJar / remapSourcesJar，直接取 jar 与 sourcesJar。
    from(tasks.named('jar')) { into 'mods' }
    from(tasks.named('sourcesJar')) { into 'sources' }
    from('docs') { into 'docs' }
    from('README.md', 'LICENSE.txt')
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

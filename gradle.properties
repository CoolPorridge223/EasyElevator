# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.caching=true

# 本机 JDK 17 工具链：MC 1.19.2 的编译与运行都要求 Java 17。
# Gradle 进程本身必须用 JDK 21+ 启动（Loom 1.11.8 的 classpath 要求 JVM 21），
# 因此 JAVA_HOME 请指向 JDK 21/25；下面这行只是把 JDK 17 交给 toolchain 用来编译。
# 若你的 JDK 17 装在 Gradle 能自动发现的位置，可以删掉下面这行。
org.gradle.java.installations.paths=D:/Program Files/Java/jdk-17


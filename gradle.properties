# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.caching=true
# 本机 JDK 17 工具链：MC 1.20.1 的编译与运行都要求 Java 17。
# Gradle 进程本身仍可用 JDK 21 启动（Wrapper 8.14.3 + Loom 1.11.8 都支持）；
# 若你的 JDK 17 装在 Gradle 能自动发现的位置，可以删掉下面这行。
org.gradle.java.installations.paths=D:/Program Files/Java/jdk-17
# Fabric Properties
# 1.20.1 线：与 main（1.21.1）共用同一份源码，产物名用 +<MC 版本> 区分。
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.19.5
# Mod Properties
mod_version=2.3.0+1.20.1
maven_group=org.DJB
archives_base_name=easyelevator
# Dependencies
fabric_version=0.92.12+1.20.1

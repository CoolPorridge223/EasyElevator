# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.caching=true
# 本线用 Java 25（Minecraft 26.3 要求的最低版本）。Gradle 进程本身可以跑在 JDK 21 上，
# 编译与运行由工具链指向下面这个 JDK 25。
org.gradle.java.installations.paths=D:/Program Files/Java/jdk-25
# Fabric Properties
# 26.1 起 Minecraft 官方发布的就是未混淆代码，Fabric 也不再维护 Yarn：
# 因此这里没有 yarn_mappings，build.gradle 里也没有 mappings 依赖（用官方命名书写源码）。
minecraft_version=26.3
loader_version=0.19.5
# Mod Properties
mod_version=2.3.0+26.3
maven_group=org.DJB
archives_base_name=easyelevator
# Dependencies
fabric_version=0.162.0+26.3
